# Packages for debian v13 (trixie)
#
#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the <DISTRO>.lock.json:
#      1. comment the lock = ... of the corresponding apt.install()
#      2. run: bazel run @<DISTRO>//:lock
version: 1
sources:
  - channel: trixie main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20260112T000000Z
  - channel: trixie-security main
    url: https://snapshot-cloudflare.debian.org/archive/debian-security/20260112T000000Z
  - channel: trixie-updates main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20260112T000000Z
archs:
  - amd64
  - arm64
packages:
  # common
  - gettext
  # buildtime
  - clang-19
  - libavahi-compat-libdnssd-dev
  - libcurl4-openssl-dev
  - libedit-dev
  - libeditreadline-dev
  - libicu-dev
  - libkrb5-dev
  - libldap-dev
  - liblz4-dev
  - libnuma-dev
  - libossp-uuid-dev
  - libpam0g-dev
  - libperl-dev
  - libpython3-dev
  - libselinux1-dev
  - libssl-dev
  - libsystemd-dev
  - liburing-dev
  - libxml2-dev
  - libxslt1-dev
  - libzstd-dev
  - llvm-19-dev
  - tcl-dev
  - uuid-dev
  - zlib1g-dev
  # runtime
  - libavahi-compat-libdnssd1
  - libcurl4t64
  - libedit2
  - libgssapi-krb5-2
  - libicu76
  - libkrb5-3
  - libldap2
  - liblz4-1
  - libnuma1
  - libossp-uuid16
  - libpam0g
  - libperl5.40
  - libpython3.13
  - libselinux1
  - libssl3t64
  - libsystemd0
  - liburing2
  - libuuid1
  - libxml2
  - libxslt1.1
  - libzstd1
  - libllvm19
  - llvm-19-runtime
  - ncurses-term
  - tcl
  - tzdata
  - zlib1g
