# Packages for debian v12 (bookworm)
#
#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the <DISTRO>.lock.json:
#      1. comment the lock = ... of the corresponding apt.install()
#      2. run: bazel run @<DISTRO>//:lock
version: 1
sources:
  - channel: bookworm main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20240210T223313Z
  - channel: bookworm-security main
    url: https://snapshot-cloudflare.debian.org/archive/debian-security/20240210T223313Z
  - channel: bookworm-updates main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20240210T223313Z/
archs:
  - amd64
  - arm64
packages:
  - libc6
  - libstdc++6
  - libgcc-s1
  - libcom-err2
  - llvm-14-runtime
  - libselinux1
  - libavahi-compat-libdnssd1
  - liburing2
  - libkeyutils1
  - libgmp10
  - libnuma1
  - libicu72
  - libidn2-0
  - libunistring2
  - libp11-kit0
  - libsasl2-2
  - libgnutls30
  - libtasn1-6
  - libnettle8
  - libhogweed6
  - libssl3
  - libxml2
  - libxslt1.1
  - libedit2
  - libzstd1
  - zlib1g
  - liblz4-1
  - libuuid1
  - libossp-uuid16
  - libpam0g
  - libcurl4
  - gettext
  - libsystemd0
  - libldap-2.5-0
  - libkrb5-3
  - libkrb5support0
  - libk5crypto3
  - libgssapi-krb5-2
  - libperl5.36
  - libpython3.11
  - tcl
