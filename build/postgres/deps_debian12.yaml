# Packages for debian v12 (bookworm)
#
#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the <DISTRO>.lock.json:
#      1. comment the lock = ... of the corresponding apt.install()
#      2. run: bazel run @<DISTRO>//:lock
version: 1
sources:
  - channel: bookworm main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20250113T000000Z
  - channel: bookworm-security main
    url: https://snapshot-cloudflare.debian.org/archive/debian-security/20250113T000000Z
  - channel: bookworm-updates main
    url: https://snapshot-cloudflare.debian.org/archive/debian/20250113T000000Z
archs:
  - amd64
  - arm64
packages:
  - gettext

  # buildtime
  - libavahi-compat-libdnssd-dev
  - libcurl4-openssl-dev
  - libedit-dev
  - libeditreadline-dev
  - libicu-dev
  - libkrb5-dev
  - libldap-dev
  - liblz4-dev
  - libnuma-dev
  - libossp-uuid-dev
  - libpam0g-dev
  - libperl-dev
  - libpython3-dev
  - libselinux1-dev
  - libssl-dev
  - libsystemd-dev
  - liburing-dev
  - libxml2-dev
  - libxslt1-dev
  - libzstd-dev
  - llvm-14-dev
  - tcl-dev
  - uuid-dev
  - zlib1g-dev
  # runtime
  - libcurl4
  - libavahi-compat-libdnssd1
  - libedit2
  - libicu72
  - libkrb5-3
  - libldap-2.5-0
  - liblz4-1
  - libnuma1
  - libossp-uuid16
  - libpam0g
  - libperl5.36
  - libpython3.11
  - libselinux1
  - libssl3
  - libsystemd0
  - liburing2
  - libxml2
  - libxslt1.1
  - libzstd1
  - llvm-14-runtime
  - tcl
  - libuuid1
  - zlib1g
  # runtime transitive
  - libstdc++6
  - libgcc-s1
  - libcom-err2
  - libllvm14
  - libffi8
  - libgomp1
  - libcap2
  - libcap-ng0
  - libavahi-client3
  - libavahi-common3
  - libkeyutils1
  - libgmp10
  - tzdata
  - libidn2-0
  - libunistring2
  - libp11-kit0
  - libsasl2-2
  - libgnutls30
  - libtasn1-6
  - libnettle8
  - libhogweed6
  - libcrypt1
  - libgcrypt20
  - libgpg-error0
  - libmd0
  - libaudit1
  - libpsl5
  - libacl1
  - libattr1
  - libexpat1
  - libz3-4
  - libbz2-1.0
  - libbrotli1
