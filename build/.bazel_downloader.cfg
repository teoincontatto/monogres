# The GNU ftp is very flaky because it's being DDOSed, see:
# https://github.com/bazelbuild/bazel-central-registry/pull/5996
# https://github.com/bazelbuild/bazel-central-registry/pull/6098
rewrite (ftp.gnu.org)/(.*) https://mirrors.kernel.org/$2
rewrite (ftpmirror.gnu.org)/(.*) https://mirrors.kernel.org/$2

# These are catch-all rewrites that try a local caching proxy first, then the
# original URL as fallback. The proxy runs on the host machine and Docker
# containers reach the host via the stable `host-gateway` hostname which is set
# in docker/Makefile.
#
# Safe to keep permanently: if the proxy is not running, Bazel falls through to
# the direct URL automatically.
rewrite ([^/]+)/(.*) http://host-gateway:8080/$1/$2
rewrite ([^/]+)/(.*) https://$1/$2
