# The GNU ftp is very flaky because it's being DDOSed, see:
# https://github.com/bazelbuild/bazel-central-registry/pull/5996
# https://github.com/bazelbuild/bazel-central-registry/pull/6098
rewrite (ftp.gnu.org)/(.*) https://mirrors.kernel.org/$2
rewrite (ftpmirror.gnu.org)/(.*) https://mirrors.kernel.org/$2

# DEBIAN'S SNAPSHOT SERVICE HAS TWO FRONTS. Every sysroot and build-time
# package is pinned to a snapshot-cloudflare.debian.org URL
# (catalog/locks/*.lock), and that front can answer `504 Gateway Timeout` for
# long stretches, failing the whole fetch phase. snapshot.debian.org serves the
# same archive at the same paths, so it is tried for each URL after the pinned
# one (several rewrites of one URL are all tried, in this order; the identity
# rewrite keeps the original first). The sha256 pins are unchanged.
rewrite (snapshot-cloudflare\.debian\.org/.*) https://$1
rewrite snapshot-cloudflare\.debian\.org/(.*) https://snapshot.debian.org/$1
